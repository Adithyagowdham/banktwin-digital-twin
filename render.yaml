# Render Blueprint for the BANKTWIN FastAPI backend.
# Deploy this from the repo root on https://render.com (New + > Blueprint).
# After it deploys, set the backend URL as NEXT_PUBLIC_API_URL on the frontend
# host (e.g. Vercel), and set CORS_ALLOW_ORIGINS to the frontend's public URL.
services:
  - type: web
    name: banktwin-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Comma-separated list of allowed frontend origins (no spaces).
      # Replace with your deployed frontend URL(s) after the frontend is live.
      - key: CORS_ALLOW_ORIGINS
        value: https://your-app.vercel.app
